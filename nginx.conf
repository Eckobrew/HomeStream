# Nginx Gateway Configuration for HomeStream
# Reverse proxies /api/ traffic to the Fastify Backend (3001) and web traffic to Next.js (3002)

map "$http_forwarded|$http_x_forwarded_for|$http_x_real_ip|$http_cf_connecting_ip" $homestream_forwarded {
    default 1;
    "|||" 0;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 256m;

    # Fastify Backend API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable buffering for live video transcodes and real-time audio streams
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js Web Frontend
    location / {
        proxy_pass http://web:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support for Next.js Fast Refresh & live updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
