services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: homestream-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - homestream-net

  backend:
    image: ${HOMESTREAM_BACKEND_IMAGE:-ghcr.io/eckobrew/homestream-backend:latest}
    container_name: homestream-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/data
      - DOWNLOADS_PATH=/downloads
      - MUSIC_PATH=/music
      - YOUTUBE_PATH=/youtube
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_USER_ID=${JELLYFIN_USER_ID:-}
      - SEERR_URL=${SEERR_URL:-}
      - SEERR_API_KEY=${SEERR_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - SLSKD_URL=${SLSKD_URL:-}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - DROPPEDNEEDLE_URL=${DROPPEDNEEDLE_URL:-}
      - DROPPEDNEEDLE_TOKEN=${DROPPEDNEEDLE_TOKEN:-}
      - QBITTORRENT_URL=${QBITTORRENT_URL:-}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-}
      - HOMESTREAM_EXTERNAL_URL=${HOMESTREAM_EXTERNAL_URL:-}
      - HOMESTREAM_MOBILE_TOKEN=${HOMESTREAM_MOBILE_TOKEN:-}
      - HOMESTREAM_SESSION_SECRET=${HOMESTREAM_SESSION_SECRET:-}
      - HOMESTREAM_SETUP_TOKEN=${HOMESTREAM_SETUP_TOKEN:-}
      - HOMESTREAM_WEBHOOK_TOKEN=${HOMESTREAM_WEBHOOK_TOKEN:-}
      - HOMESTREAM_TRUST_PROXY=${HOMESTREAM_TRUST_PROXY:-true}
      - HOMESTREAM_TRUSTED_PROXIES=${HOMESTREAM_TRUSTED_PROXIES:-}
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - ${MUSIC_PATH:-./music}:/music
      - ${YOUTUBE_PATH:-./youtube}:/youtube
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/api/mobile/v1/discovery"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homestream-net

  web:
    image: ${HOMESTREAM_WEB_IMAGE:-ghcr.io/eckobrew/homestream-web:latest}
    container_name: homestream-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-HomeStream}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homestream-net

networks:
  homestream-net:
    name: homestream-net
    driver: bridge
